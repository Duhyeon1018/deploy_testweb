<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 미니실습</title>
    <style>
        h1 {
            display: block;
            text-align: center;
            color: purple;
            text-decoration: none;
            font-size: 30px;
            border-bottom: solid;
            border-color: pink;
        }

        a:link,
        a:visited {
            color: black;
            text-decoration: none;
        }

        ul {
            list-style: none;
            width: 500px;
            margin: 10px auto;
            padding: 0;
        }

        li {
            display: inline-block;
            width: 120px;
            border: 1px solid #ccc;
            padding: 10px 15px;
            font-size: 16px;
            text-align: center;
        }

        #result {
            width: 500px;
            height: 300px;
            margin: 30px auto;
            border: 2px solid #ccc;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition:all 0.5s;
        }

        #result:hover {
            background-size: 120% !important
        }




        .text {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1><b>미니실습</b></h1>
    <ul>
        <li><a href="#"
                onclick="changeBg('무화과케이크.jpg', '메뉴:무화과케이크<br>가격: 8000원<br>위치:부산 부산진구 전포대로176번길 28 1층')">케이크</a>
        </li>
        <li><a href="#"
                onclick="changeBg('소바.jpg', '메뉴:소바<br>가격: 12000원<br>위치:부산 부산진구 동천로 105 1층 칸다소바')">소바</a>
        </li>
        <li><a href="#"
                onclick="changeBg('이재명피자.jpg', '메뉴:피자<br>가격: 29000원<br>위치:부산 부산진구 전포대로209번길 21')">피자</a>
        </li>
    </ul>
    <div id="result">
        <div class="text"></div>
    </div>

    <script>
        function changeBg(img, text) {
            var result = document.querySelector('#result');
            var textElement = document.querySelector('.text'); // 텍스트 요소 선택

            result.style.backgroundImage = 'url(' + img + ')';
            result.style.backgroundSize = '100%';
            result.style.backgroundPosition = 'center';
            textElement.innerHTML = text;
        }
    </script>
</body>

</html>
