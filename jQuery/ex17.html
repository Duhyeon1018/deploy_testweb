<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- jQuery 준비물, cdn, 서버에서 받기-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        function move(obj, time) {
            $(obj).stop().animate({
                left: -350,
                top: 0
            }, time);
        }
        function back(css) {
            $(css).stop().animate({
                left: 0,
                top: 0
            });
        }
    </script>
    <style>
        .moving {
            border: 1px solid #000000;
            margin: 20px auto 0 auto;
            text-align: right;
            width: 550px;
        }

        .moving img {
            cursor: pointer;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="init">
        <button type="button" onclick="back('.moving img')">초기화상태</button><br>
    </div>
    <div class="moving">
        <img onclick="move(this, 3000)" src="../소바.jpg" width="50%" /><br>
        <img onclick="move(this, 2000)" src="../국밥.jpg" width="50%" /><br>
        <img onclick="move(this, 1000)" src="../고기.jpg" width="50%" /><br>
    </div>
</body>

</html>
