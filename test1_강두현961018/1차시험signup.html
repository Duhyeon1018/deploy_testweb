<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="1차시험signup.css">
</head>
<body>
    <div class="signup-container">
        <form id="signup-form">
            <label for="username">ID</label>
            <input id="username" type="text" placeholder="아이디" required>
            <label for="password">PASSWORD</label>
            <input id="password" type="password" placeholder="비밀번호" required>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="ex>rkdengus1234@naver.com" required>
            <button type="submit">회원가입</button>
        </form>
    </div>

    <script>
        window.onload = function() {
            alert("환영합니다!");
        };
    </script>
</body>
</html>
